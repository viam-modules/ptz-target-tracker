name: Publish Module

# Publishing is driven by GitHub releases only: cutting a release publishes that
# tag to the Viam registry. Pushes to main deliberately publish nothing, so main
# can move without minting registry versions. workflow_dispatch is the manual
# escape hatch — re-run a publish that failed without cutting a second release.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Version tag (e.g. v0.0.21)
        required: true

permissions:
  contents: read

jobs:
  publish-module:
    name: Build and upload to Viam Registry
    runs-on: ubuntu-24.04
    steps:
      # actions/checkout@v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      # Cross-platform builds run on Viam's cloud builders, driven by the
      # `build` block in meta.json — this job only kicks them off and waits.
      # viamrobotics/build-action@v1.7.2
      - uses: viamrobotics/build-action@68c0a3cef8247f2324a6de7107b09fa9e9ef8b49
        with:
          # On a release event `github.ref_name` is the release tag; the
          # explicit input wins on a manual dispatch.
          version: ${{ inputs.version || github.ref_name }}
          ref: ${{ github.sha }}
          key-id: ${{ secrets.viam_key_id }}
          key-value: ${{ secrets.viam_key_value }}
          token: ${{ github.token }}
