name: Publish Module

# Publishing is driven by GitHub releases only: cutting a release publishes that
# tag to the Viam registry. Pushes to main deliberately publish nothing, so main
# can move without minting registry versions. workflow_dispatch is the manual
# escape hatch — re-run a publish that failed without cutting a second release.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Version tag (e.g. v0.0.21)
        required: true

permissions:
  contents: read

jobs:
  publish-module:
    name: Build and upload to Viam Registry
    runs-on: ubuntu-24.04
    steps:
      # actions/checkout@v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # Cross-platform builds run on Viam's cloud builders, driven by the
      # `build` block in meta.json — this job only kicks them off and waits.
      # viamrobotics/build-action@v1.7.3
      - uses: viamrobotics/build-action@b885e11b378e05476ee0109c9fc8ecb387b508e2
        with:
          # On a release event `github.ref_name` is the release tag; the
          # explicit input wins on a manual dispatch.
          version: ${{ inputs.version || github.ref_name }}
          ref: ${{ github.sha }}
          key-id: ${{ secrets.viam_key_id }}
          key-value: ${{ secrets.viam_key_value }}
          token: ${{ github.token }}

  notify-slack:
    name: Notify Slack
    needs: [publish-module]
    # `always()` so a failed publish still gets announced — a silent failure is
    # the case most worth hearing about.
    if: always() && needs.publish-module.result != 'skipped'
    runs-on: ubuntu-24.04
    env:
      # Mirrored into `env` because the `secrets` context is not readable from a
      # step-level `if`, and the step below has to test whether they are set.
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
    steps:
      - name: Send Slack message
        # A repo with no Slack secrets configured skips the notification instead
        # of failing the run — the publish result above is the real outcome, and
        # turning every release red over a missing token trains people to ignore
        # the red. The skip is visible in the run summary.
        if: env.SLACK_BOT_TOKEN != '' && env.SLACK_CHANNEL_ID != ''
        # slackapi/slack-github-action@v4.0.0
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          errors: true
          payload: |
            {
              "channel": "${{ secrets.SLACK_CHANNEL_ID }}",
              "text": "Publish ${{ inputs.version || github.ref_name }} of ${{ github.repository }} ${{ needs.publish-module.result == 'success' && 'succeeded' || 'failed' }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "${{ needs.publish-module.result == 'success' && ':white_check_mark:' || ':x:' }} Publish *${{ inputs.version || github.ref_name }}* of `${{ github.repository }}` *${{ needs.publish-module.result == 'success' && 'succeeded' || 'failed' }}*\n\t<${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ inputs.version || github.ref_name }}|Release ${{ inputs.version || github.ref_name }}>\n\t<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Workflow run>"
                  }
                }
              ]
            }
